# Built from rimworld skill reference ci-build-release.yml
name: Build & Release

on:
  push:
    tags: ['[0-9]*', 'v*']
  workflow_dispatch:

env:
  RIMWORLD_VERSION: '1.6'
  MOD_PACKAGE_ID: scarf.cjkinput
  SOLUTION_FILE: Source/FcitxCjkInput/FcitxCjkInput.csproj
  ASSEMBLY_DIR: 1.6/Assemblies
  RIMWORLD_REF: /tmp/rimworld-refs
  RIMWORLD_17_REF: /tmp/rimworld-1.7-refs

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: check RimWorld 1.7 references
        run: |
          test -f "$RIMWORLD_17_REF/UnityStubs.dll" || {
            echo "::error::RimWorld 1.7 reference assemblies are not publicly available; release locally with 'just build'."
            exit 1
          }

      - name: install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc libdbus-1-dev libxkbcommon-dev libwayland-dev pkg-config p7zip-full curl lib32gcc-s1 steamcmd

      - name: cache RimWorld assemblies
        id: cache-rw
        uses: actions/cache@v4
        with:
          path: ${{ env.RIMWORLD_REF }}
          key: rimworld-${{ env.RIMWORLD_VERSION }}-refs-v1

      - name: download RimWorld assemblies
        if: steps.cache-rw.outputs.cache-hit != 'true'
        run: |
          steamcmd +force_install_dir "$RIMWORLD_REF" \
            +login anonymous \
            +app_update 294100 -beta "$RIMWORLD_VERSION" validate \
            +quit

      - name: download Harmony
        run: |
          curl -sLO https://github.com/pardeike/HarmonyRimWorld/releases/latest/download/HarmonyMod.zip
          7z x -y HarmonyMod.zip -opackages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: build RimWorld 1.6 bridge and assembly
        run: |
          mkdir -p Source/obj/rimworld-1.6 "$ASSEMBLY_DIR"
          git archive origin/rimworld-1.6 Source native | tar -x -C Source/obj/rimworld-1.6
          ln -sfn "$PWD/packages" Source/obj/rimworld-1.6/packages
          gcc -shared -fPIC -fvisibility=hidden -pthread -Wl,-soname,libfcitxcjkinput.so \
            -o "$ASSEMBLY_DIR/libfcitxcjkinput.so" \
            Source/obj/rimworld-1.6/native/fcitxcjkinput.c \
            $(pkg-config --cflags --libs dbus-1) -Wall -Wextra -O2
          dotnet build Source/obj/rimworld-1.6/$SOLUTION_FILE -c Release \
            -p:STEAM_APPS="$RIMWORLD_REF" \
            -p:STEAM_OS="RimWorldLinux_Data" \
            -p:OutputPath="$PWD/$ASSEMBLY_DIR/"

      - name: build RimWorld 1.7 bridge and assembly
        run: |
          mkdir -p 1.7/Assemblies
          gcc -shared -fPIC -fvisibility=hidden -Wl,-soname,libfcitxcjkinput.so \
            -o 1.7/Assemblies/libfcitxcjkinput.so native/fcitxcjkinput.c \
            $(pkg-config --cflags --libs dbus-1 xkbcommon wayland-client) -Wall -Wextra -Werror -O2
          dotnet run --project Source/FcitxCjkInput.Tests/FcitxCjkInput.Tests.csproj -c Release
          dotnet build "$SOLUTION_FILE" -c Release -p:RIMWORLD_DIR="$RIMWORLD_17_REF"

      - name: verify built artifacts
        run: |
          for dir in "$ASSEMBLY_DIR" 1.7/Assemblies; do
            test -f "$dir/FcitxCjkInput.dll"
            test -f "$dir/libfcitxcjkinput.so"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}
          path: |
            ${{ env.ASSEMBLY_DIR }}/
            1.7/Assemblies/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}

      - name: create mod archive
        run: |
          pkg="$MOD_PACKAGE_ID"
          mkdir -p "dist/$pkg"
          # metadata
          cp -r About "dist/$pkg/"
          # assemblies
          for ver in 1.6 1.7; do
            mkdir -p "dist/$pkg/$ver"
            cp -r "$ver/Assemblies" "dist/$pkg/$ver/"
          done
          # optional mod directories
          for dir in Defs Languages Patches Textures; do
            [ -d "$dir" ] && cp -r "$dir" "dist/$pkg/"
          done
          cd dist && zip -r "../$pkg-${{ github.ref_name }}.zip" "$pkg"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MOD_PACKAGE_ID }}-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
